<!DOCTYPE html>
<html lang="en">
    <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Exercise 04: Forms & Inputs</title>
    </head>
    <body>
        <h3>User Registration Form</h3>
        <p>Please fill out the form below to register:</p>
        <form action="#" method="POST">
            <label for="username">Username:</label>
            <input type="text" id="username" minlength="3" maxlength="20" required>
            <br>
            <br>
            <hr>
            <label for="email">Email:</label>
            <input type="email" id="email" required>
            <br>
            <br>
            <hr>
            <label for="password">Password:</label>
            <input type="password" id="password" minlength="6" maxlength="10" required>
            <br>
            <br>
            <hr>
            <label for="age">Age:</label>
            <input type="number" id="age" min="18" max="35" required >
            <br>
            <br>
            <hr>
            <label for="Campus">Campus:</label>
            <select id="Campus" required>    
                <option value="42 Amman" required>42 Amman</option>
                <option value="42 Irbid">42 Irbid</option>
                 </select>
                <br>
                <br>
                <hr>
           
                <label for="status">Status:</label><br> 
                <input type="radio" value="student" name="status" required>
                <label for="student">Student</label>
                <input type="radio" value="graduate" name="status" required>
                <label for="graduate">Graduate</label>
                <input type="radio" value="employed" name="status" required>
                <label for="employed">Employed</label>  
                <br>
                <br>
            <label for="agree">Agree to Terms and Conditions:</label>
            <input type="checkbox" id="agree" value="agree" required>
            <br>
            <br>
            <hr>
            <button type="submit">Register</button>
            </form>
            </body>
</html>
